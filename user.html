<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User</title>
    <link rel="stylesheet" href="./css/style1.css">
</head>

<body>
    <section id="profile">
        <div class="users">
            <div class="user">
                <div class="user-info">
                    <div class="info-profile">
                        <div class="img">
                            <img src="./img/OIP (2).webp" alt="profile">
                        </div>
                    </div>
                    <div class="info-about">
                        <div class="name">
                            <p>Leslie Walton</p>
                        </div>
                        <div class="username">
                            <p>@username</p>
                        </div>
                        <div class="profession">
                            <p>Developer</p>
                        </div>
                    </div>
                    <div class="plus">
                        <p>+</p>
                    </div>
                </div>
                <div class="user-connection">
                    <div class="statistics">
                        <div class="shots">
                            <h3>17</h3>
                            <p>Shots</p>
                        </div>
                        <div class="following">
                            <h3>17</h3>
                            <p>Following</p>
                        </div>
                        <div class="followers">
                            <h3>17</h3>
                            <p>Followers</p>
                        </div>
                    </div>
                    <div class="message">
                        <p>Send Message</p>
                    </div>
                    <div class="more">
                        <p>More <i class="fa-solid fa-chevron-down"></i></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
